---
name: Terraform Validate

on:
  pull_request:
    paths:
      - "**/*.tf"
      - ".terraform.lock.hcl"
      - ".terraform-version"
      - ".tflint.hcl"
      - ".github/workflows/terraform-validate.yaml"

  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - ".terraform.lock.hcl"
      - ".terraform-version"
      - ".tflint.hcl"
      - ".github/workflows/terraform-validate.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Display Terraform version
        run: terraform version

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v5.0.0
        with:
          tflint_version: v0.59.1

      - name: Display TFLint version
        run: tflint --version

      - name: Initialize TFLint plugins
        run: tflint --init

      - name: Run TFLint
        run: |
          tflint \
            --recursive \
            --format=compact \
            --minimum-failure-severity=error