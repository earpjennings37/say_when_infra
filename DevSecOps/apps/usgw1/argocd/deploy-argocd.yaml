kind: Application
metadata:
  name: root-west
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wyatt/say_when.git
    path: apps/usgw1/argocd
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true