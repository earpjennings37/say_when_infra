configs:
  params:
    server.insecure: true
  cm:
    applicationSet:
      enableNewGenerators: "true"

    # Give child Applications a real health status so sync waves in
    # the app-of-apps (monitoring-root) wait for each wave to become
    # Healthy before starting the next one. Argo CD removed this
    # built-in check in v1.8; this is the snippet from its docs.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  repositories:
    bitnami-oci:
      name: bitnami-oci
      type: helm
      url: registry-1.docker.io/bitnamicharts
      enableOCI: "true"

server:
  enabled: true
  insecure: true

  service:
    type: ClusterIP
    ports:
      http: 80

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-server

controller:
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 1Gi

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-application-controller

repoServer:
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      cpu: 300m
      memory: 384Mi

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-repo-server

installCRDs: true

applicationSet:
  enabled: true
  replicas: 1

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: argocd-applicationset-controller

dex:
  enabled: false

redis:
  enabled: true

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

additionalProjects: []