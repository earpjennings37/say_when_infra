configs:
  params:
    server.insecure: true
  cm:
    applicationSet:
      enableNewGenerators: "true"

server:
  enabled: true
  insecure: true
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 80
        targetPort: 8080

controller:
  replicas: 1

repoServer:
  replicas: 1

installCRDs: true

applicationSet:
  enabled: true
  replicas: 1

dex:
  enabled: false

redis:
  enabled: true